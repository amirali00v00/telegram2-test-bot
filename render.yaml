services:
  - type: web
    name: telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: AI_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
